<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiant — Change Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', path='css/style.css') }}" rel="stylesheet">
</head>
<body>

<!-- Shared Header (logged in state) -->
<header class="radiant-header d-flex align-items-center justify-content-between">
  <div class="d-flex align-items-center">
    <img src="{{ url_for('static', path='images/radiant-logo.png') }}" alt="Radiant" class="radiant-logo-img">
  </div>
  <div class="d-flex align-items-center gap-2">
    <a href="/supplier/upload" class="btn btn-danger rounded-pill btn-sm px-3">Upload 4M Form</a>
    <a href="/supplier/history" class="btn btn-navy rounded-pill btn-sm px-3">History</a>
    <a href="/supplier/change-password" class="logout-link ms-2">Change Password</a>
    <form method="post" action="/logout" class="d-inline">
      <button type="submit" class="logout-link border-0 bg-transparent p-0">Logout</button>
    </form>
  </div>
</header>

<div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <h5 class="text-navy fw-bold mb-3">Change Password</h5>

      <div class="card card-panel shadow-sm">
        <div class="card-body p-4">
          <form method="post" action="/supplier/change-password">
            <div class="mb-3">
              <label for="currentPassword" class="form-label">Current Password</label>
              <input type="password" class="form-control" id="currentPassword" name="current_password" required>
            </div>
            <div class="mb-3">
              <label for="newPassword" class="form-label">New Password</label>
              <input type="password" class="form-control" id="newPassword" name="new_password" required>
            </div>

            {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">
              {{ error }}
            </div>
            {% endif %}

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-navy rounded-pill">Save</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
