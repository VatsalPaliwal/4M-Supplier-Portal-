<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiant — Reset Supplier Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', path='css/style.css') }}" rel="stylesheet">
</head>
<body>

<!-- Admin Header (same as Admin Dashboard) -->
<header class="admin-header d-flex align-items-center justify-content-between">
  <div class="d-flex align-items-center">
    <div class="admin-logo-wrap">
      <img src="{{ url_for('static', path='images/radiant-logo.png') }}" alt="Radiant" class="radiant-logo-img">
    </div>
  </div>
  <div class="d-flex align-items-center gap-3">
    <span class="admin-header-name">Radiant Admin</span>
    <span class="badge admin-badge">Admin</span>
    <form method="post" action="/logout" class="d-inline">
      <button type="submit" class="admin-logout-link border-0 bg-transparent p-0">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </form>
  </div>
</header>

<div class="container admin-page py-4">

  <a href="/admin/dashboard" class="back-link mb-3 d-inline-flex align-items-center gap-1">
    <i class="bi bi-arrow-left"></i> Back to Admin Dashboard
  </a>

  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <h5 class="fw-bold mb-1">Reset Password</h5>
      <p class="text-muted mb-3">Set a new password for this supplier's account.</p>

      <div class="card card-panel shadow-sm">
        <div class="card-body p-4">
          <form method="post" action="{{ request.url.path }}" onsubmit="return confirm('Are you sure you want to reset this password? The supplier will need to use the new password to log in.');">
            <div class="mb-3">
              <label for="newSupplierPassword" class="form-label">New Password</label>
              <input type="password" class="form-control" id="newSupplierPassword" name="new_password" required>
            </div>

            {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">
              {{ error }}
            </div>
            {% endif %}

            <div class="d-flex gap-2 mt-4">
              <a href="/admin/dashboard" class="btn btn-outline-secondary rounded-pill flex-fill">Cancel</a>
              <button type="submit" class="btn btn-navy rounded-pill flex-fill">Save</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% include 'session_modal.html' %}
</body>
</html>
