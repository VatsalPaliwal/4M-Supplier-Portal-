<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiant — Forgot Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', path='css/style.css') }}" rel="stylesheet">
</head>
<body>

<!-- Shared Header (logged out state) -->
<header class="radiant-header d-flex align-items-center justify-content-between">
  <div class="d-flex align-items-center">
    <img src="{{ url_for('static', path='images/radiant-logo.png') }}" alt="Radiant" class="radiant-logo-img">
  </div>
  <div></div>
</header>

<div class="login-wrapper">
  <div class="card login-card shadow-sm">
    <div class="card-body p-4">
      <!-- ===== Step 1 & 2: Email + OTP ===== -->
      <div id="requestSection">
        <h5 class="card-title text-navy fw-bold text-center mb-4">Forgot Password</h5>
      
        <div class="mb-3">
          <label for="fpEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="fpEmail" required>
        </div>
      
        <div class="mb-3 d-none" id="fpOtpWrap">
          <label for="fpOtp" class="form-label">Enter OTP</label>
          <input type="text" class="form-control" id="fpOtp" inputmode="numeric" autocomplete="one-time-code">

          <!-- Resend OTP Button -->
          <div class="text-end mt-1">
            <button type="button" class="btn btn-link btn-sm text-navy p-0" id="resendFpOtpBtn">Resend OTP</button>
          </div>
        </div>
      
        <p class="text-muted small d-none" id="fpSentMessage">An OTP has been sent to your registered email.</p>
      
        <div id="fpError" class="alert alert-danger py-2 small d-none" role="alert"></div>
      
        <div class="d-grid mt-4">
          <button type="button" class="btn btn-navy rounded-pill" id="fpActionBtn">Send OTP</button>
        </div>
      
        <div class="text-center mt-3">
          <a href="/" class="small text-navy">Back to Login</a>
        </div>
      </div>
      <!-- ===== Step 3: Reset Password ===== -->
      <div id="resetSection" class="d-none">
        <h5 class="card-title text-navy fw-bold text-center mb-4">Reset Password</h5>

        <div class="mb-3">
          <label for="newPassword" class="form-label">New Password</label>
          <input type="password" class="form-control" id="newPassword" required>
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" required>
        </div>

        <div id="resetError" class="alert alert-danger py-2 small d-none" role="alert"></div>
        <div id="resetSuccess" class="alert alert-success py-2 small d-none" role="alert"></div>

        <div class="d-grid mt-4">
          <button type="button" class="btn btn-navy rounded-pill" id="resetPasswordBtn">Reset Password</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  var requestSection = document.getElementById('requestSection');
  var resetSection = document.getElementById('resetSection');

  var fpEmail = document.getElementById('fpEmail');
  var fpOtpWrap = document.getElementById('fpOtpWrap');
  var fpOtp = document.getElementById('fpOtp');
  var fpSentMessage = document.getElementById('fpSentMessage');
  var fpError = document.getElementById('fpError');
  var fpActionBtn = document.getElementById('fpActionBtn');
  var resendFpOtpBtn = document.getElementById('resendFpOtpBtn');

  var newPassword = document.getElementById('newPassword');
  var confirmPassword = document.getElementById('confirmPassword');
  var resetError = document.getElementById('resetError');
  var resetSuccess = document.getElementById('resetSuccess');
  var resetPasswordBtn = document.getElementById('resetPasswordBtn');

  // Tracks which step the single action button currently performs:
  // "send" -> calls /forgot-password, "verify" -> calls /verify-otp.
  var currentStep = 'send';

  function showFpError(message) {
    fpError.textContent = message;
    fpError.classList.remove('d-none');
  }

  function hideFpError() {
    fpError.classList.add('d-none');
    fpError.textContent = '';
  }

  fpActionBtn.addEventListener('click', function () {
    hideFpError();

    if (currentStep === 'send') {
      var email = fpEmail.value.trim();
      if (!email) {
        showFpError('Please enter your email.');
        return;
      }

      fpActionBtn.disabled = true;

      fetch('/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ email: email })
      })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          if (data.success === false || data.error || data.detail) {
            showFpError(data.error || data.detail || 'Could not send OTP. Please try again.');
            return;
          }
          // Move to step 2: reveal the OTP field, switch the button to "Verify OTP".
          fpOtpWrap.classList.remove('d-none');
          fpSentMessage.classList.remove('d-none');
          fpEmail.readOnly = true;
          fpActionBtn.textContent = 'Verify OTP';
          currentStep = 'verify';
          fpOtp.focus();
        })
        .catch(function () {
          showFpError('Something went wrong. Please try again.');
        })
        .finally(function () {
          fpActionBtn.disabled = false;
        });

    } else if (currentStep === 'verify') {
      var otp = fpOtp.value.trim();
      if (!otp) {
        showFpError('Please enter the OTP.');
        return;
      }

      fpActionBtn.disabled = true;

      fetch('/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ email: fpEmail.value.trim(), otp: otp })
      })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          if (data.success === false || data.error || data.detail) {
            showFpError(data.error || data.detail || 'Invalid OTP. Please try again.');
            return;
          }
          // Move to step 3: hide the request section, show the reset form.
          requestSection.classList.add('d-none');
          resetSection.classList.remove('d-none');
        })
        .catch(function () {
          showFpError('Something went wrong. Please try again.');
        })
        .finally(function () {
          fpActionBtn.disabled = false;
        });
    }
  });

  // Resend OTP Event Listener
  if (resendFpOtpBtn) {
    resendFpOtpBtn.addEventListener('click', function () {
      hideFpError();
      resendFpOtpBtn.disabled = true;

      fetch('/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ email: fpEmail.value.trim() })
      })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          if (data.success === false || data.error || data.detail) {
            showFpError(data.error || data.detail || 'Could not resend OTP.');
            return;
          }
          fpSentMessage.textContent = 'A new OTP has been sent to your email.';
        })
        .catch(function () {
          showFpError('Something went wrong. Please try again.');
        })
        .finally(function () {
          resendFpOtpBtn.disabled = false;
        });
    });
  }

  resetPasswordBtn.addEventListener('click', function () {
    resetError.classList.add('d-none');
    resetSuccess.classList.add('d-none');

    var pw = newPassword.value;
    var confirmPw = confirmPassword.value;

    if (!pw || !confirmPw) {
      resetError.textContent = 'Please fill in both password fields.';
      resetError.classList.remove('d-none');
      return;
    }
    if (pw !== confirmPw) {
      resetError.textContent = 'Passwords do not match.';
      resetError.classList.remove('d-none');
      return;
    }

    resetPasswordBtn.disabled = true;

    fetch('/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        email: fpEmail.value.trim(),
        new_password: pw,
        confirm_password: confirmPw
      })
    })
      .then(function (response) { return response.json(); })
      .then(function (data) {
        if (data.success === false || data.error || data.detail) {
          resetError.textContent = data.error || data.detail || 'Could not reset password. Please try again.';
          resetError.classList.remove('d-none');
          return;
        }
        resetSuccess.textContent = 'Password reset successfully. Redirecting to login...';
        resetSuccess.classList.remove('d-none');
        setTimeout(function () {
          window.location.href = '/';
        }, 1500);
      })
      .catch(function () {
        resetError.textContent = 'Something went wrong. Please try again.';
        resetError.classList.remove('d-none');
      })
      .finally(function () {
        resetPasswordBtn.disabled = false;
      });
  });
</script>
</body>
</html>
