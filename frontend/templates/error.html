<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiant — {{ status_code }} {{ title|default("Error") }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', path='css/style.css') }}" rel="stylesheet">
</head>
<body>

<!-- Shared Header (logged out / minimal state) -->
<header class="radiant-header d-flex align-items-center justify-content-between">
  <div class="d-flex align-items-center">
    <img src="{{ url_for('static', path='images/radiant-logo.png') }}" alt="Radiant" class="radiant-logo-img">
  </div>
  <div></div>
</header>

<div class="login-wrapper">
  <div class="card login-card shadow-sm text-center">
    <div class="card-body p-4">
      <i class="bi bi-exclamation-triangle text-navy" style="font-size: 2.5rem;"></i>
      <h4 class="fw-bold mt-3 mb-1">{{ status_code }} — {{ title|default("Something went wrong") }}</h4>
      <p class="text-muted mb-4">{{ detail|default("An unexpected error occurred.") }}</p>
      <a href="/" class="btn btn-navy rounded-pill px-4">Back to Login</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
